services:
  db:
    image: postgres:16-alpine
    container_name: fnb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnb
      POSTGRES_PASSWORD: fnb_dev
      POSTGRES_DB: fnb_control_pane
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fnb", "-d", "fnb_control_pane"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fnb_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    container_name: fnb_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fnb:fnb_dev@db:5432/fnb_control_pane
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      NODE_ENV: development
      LOG_LEVEL: debug
      API_PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: pnpm --filter @app/api dev

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    container_name: fnb_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fnb:fnb_dev@db:5432/fnb_control_pane
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: http://api:4000/graphql
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_API_URL: http://api:4000/graphql
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    command: pnpm --filter web dev

volumes:
  db_data:
