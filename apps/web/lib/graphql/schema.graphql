type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  """Audit-log entries within the current tenant. Requires admin role."""
  auditLogs(after: String, before: String, first: Int, last: Int): QueryAuditLogsConnection

  """
  All non-archived categories within the current tenant. Requires manager role.
  """
  catalogCategories: [Category!]

  """Single menu item by id (tenant-scoped). Requires manager role."""
  catalogItem(id: UUID!): MenuItem

  """Menu items within the current tenant. Requires manager role."""
  catalogItems(after: String, before: String, filter: CatalogItemFilter, first: Int, last: Int): QueryCatalogItemsConnection
  catalogModifierGroup(id: UUID!): ModifierGroup

  """Modifier groups within the current tenant. Requires manager role."""
  catalogModifierGroups(after: String, before: String, first: Int, last: Int): QueryCatalogModifierGroupsConnection

  """
  All non-archived tax categories for the current tenant. Requires manager role.
  """
  catalogTaxCategories: [TaxCategory!]

  """Look up an invitation by its single-use token. Anonymous-allowed."""
  invitationByToken(token: String!): InvitationLookup

  """Menus that are active and live at the given moment. Defaults to now."""
  locationActiveMenus(at: DateTime): [Menu!]

  """
  Single menu by id, scoped to the viewer's location. Requires manager role.
  """
  locationMenu(id: UUID!): Menu

  """
  All non-archived menus at the viewer's location. Requires manager role.
  """
  locationMenus: [Menu!]

  """All LocationItem rows at the viewer's location. Requires manager role."""
  locationOverrides: [LocationItem!]

  """Tenants the current viewer has at least one ACTIVE membership in."""
  myTenants: [Tenant!]

  """Pending (unaccepted, unexpired) invitations within the current tenant."""
  tenantInvitations: [Invitation!]

  """
  All non-archived locations within the current tenant. Requires admin role.
  """
  tenantLocations: [Location!]

  """Memberships within the current tenant. Requires admin role."""
  tenantMembers(after: String, before: String, first: Int, last: Int): QueryTenantMembersConnection

  """The currently signed-in user, regardless of tenant context."""
  viewer: Viewer
}

type QueryAuditLogsConnection {
  edges: [QueryAuditLogsConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type QueryAuditLogsConnectionEdge {
  cursor: String!
  node: AuditLog
}

