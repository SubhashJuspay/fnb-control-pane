input AcceptInvitationInput {
  name: String!
  password: String!
  token: String!
}

type AppError {
  code: String
  message: String
}

type AuditLog {
  action: String
  actorEmail: String
  actorUserId: String
  createdAt: DateTime
  id: ID
  metadata: JSON
  resourceId: String
  resourceType: String
}

input CreateLocationInput {
  businessDayCutoff: String
  currency: String!
  locale: String
  name: String!
  slug: String!
  timezone: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Invitation {
  acceptedAt: DateTime
  createdAt: DateTime
  email: String
  expiresAt: DateTime
  id: ID
  location: Location
  role: Role
  tenant: Tenant
}

"""Sanitized view of an Invitation suitable for the public sign-up page."""
type InvitationLookup {
  acceptedAt: DateTime
  email: String
  expiresAt: DateTime
  id: ID
  locationName: String
  role: Role
  tenantName: String
}

input InviteStaffInput {
  email: String!
  locationId: String
  role: Role!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

type Location {
  businessDayCutoff: String
  createdAt: DateTime
  currency: String
  id: ID
  locale: String
  name: String
  slug: String
  status: LocationStatus
  tenant: Tenant
  timezone: String
}

enum LocationStatus {
  ACTIVE
  ARCHIVED
  CLOSED
}

type Membership {
  createdAt: DateTime
  id: ID
  location: Location
  role: Role
  status: MembershipStatus
  tenant: Tenant
  user: User
}

enum MembershipStatus {
  ACTIVE
  REVOKED
}

type Mutation {
  acceptInvitation(input: AcceptInvitationInput!): User
  createLocation(input: CreateLocationInput!): Location
  inviteStaff(input: InviteStaffInput!): Invitation
  revokeInvitation(input: RevokeInvitationInput!): RevokeInvitationResult
  revokeMembership(input: RevokeMembershipInput!): Membership
  updateMembershipRole(input: UpdateMembershipRoleInput!): Membership
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  """Audit-log entries within the current tenant. Requires admin role."""
  auditLogs(after: String, before: String, first: Int, last: Int): QueryAuditLogsConnection

  """Look up an invitation by its single-use token. Anonymous-allowed."""
  invitationByToken(token: String!): InvitationLookup

  """Tenants the current viewer has at least one ACTIVE membership in."""
  myTenants: [Tenant!]

  """Pending (unaccepted, unexpired) invitations within the current tenant."""
  tenantInvitations: [Invitation!]

  """
  All non-archived locations within the current tenant. Requires admin role.
  """
  tenantLocations: [Location!]

  """Memberships within the current tenant. Requires admin role."""
  tenantMembers(after: String, before: String, first: Int, last: Int): QueryTenantMembersConnection

  """The currently signed-in user, regardless of tenant context."""
  viewer: Viewer
}

type QueryAuditLogsConnection {
  edges: [QueryAuditLogsConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type QueryAuditLogsConnectionEdge {
  cursor: String!
  node: AuditLog
}

type QueryTenantMembersConnection {
  edges: [QueryTenantMembersConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type QueryTenantMembersConnectionEdge {
  cursor: String!
  node: Membership
}

input RevokeInvitationInput {
  invitationId: String!
}

"""Result of revoking an invitation: the id of the deleted row."""
type RevokeInvitationResult {
  id: ID
}

input RevokeMembershipInput {
  membershipId: String!
}

enum Role {
  ADMIN
  MANAGER
  OWNER
  STAFF
  VIEWER
}

type Tenant {
  createdAt: DateTime
  id: ID
  locations: [Location!]
  name: String
  slug: String
  status: TenantStatus
}

enum TenantStatus {
  ACTIVE
  DELETED
  SUSPENDED
}

scalar UUID

input UpdateMembershipRoleInput {
  membershipId: String!
  role: Role!
}

type User {
  email: String
  id: ID
  image: String
  mfaEnabled: Boolean
  name: String
}

enum UserStatus {
  ACTIVE
  DISABLED
}

type Viewer {
  email: String
  id: ID

  """Active memberships for this viewer across all tenants."""
  memberships: [Membership!]
  name: String

  """Tenants this viewer has at least one ACTIVE membership in."""
  tenants: [Tenant!]
}