type Mutation {
  acceptInvitation(input: AcceptInvitationInput!): User
  addItemToMenuSection(input: AddItemToMenuSectionInput!): MenuSectionItem
  addModifier(input: AddModifierInput!): Modifier
  addTicketItem(input: AddTicketItemInput!): TicketItem
  addWalkin(input: AddWalkinInput!): Reservation
  applyLineDiscount(input: ApplyLineDiscountInput!): Discount
  applyTicketDiscount(input: ApplyTicketDiscountInput!): Discount
  archiveCategory(input: ArchiveCategoryInput!): Category
  archiveGuest(input: ArchiveGuestInput!): Guest
  archiveJobRole(input: ArchiveJobRoleInput!): JobRole
  archiveMenu(input: ArchiveMenuInput!): Menu
  archiveMenuItem(input: ArchiveMenuItemInput!): MenuItem
  archiveMenuSection(input: ArchiveMenuSectionInput!): MenuSection
  archiveModifier(input: ArchiveModifierInput!): Modifier
  archiveModifierGroup(input: ArchiveModifierGroupInput!): ModifierGroup
  archiveSection(input: ArchiveSectionInput!): Section
  archiveTable(input: ArchiveTableInput!): Table
  """Soft-archive a tip pool rule (sets archivedAt). Manager+ only."""
  archiveTipPoolRule(id: UUID!): TipPoolRule
  assignTableServer(input: AssignTableServerInput!): Table
  attachModifierGroupToItem(input: AttachModifierGroupInput!): AttachModifierGroupResult
  cancelReservation(input: CancelReservationInput!): Reservation
  cancelShift(input: CancelShiftInput!): Shift
  """
  Close an open drawer session with the counted cash total. Computes expected vs counted variance and stores it.
  """
  closeCashDrawer(countedCashCents: Int!, note: String, sessionId: UUID!): CashDrawerSession
  closeTicket(input: CloseTicketInput!): Ticket
  completeReservation(input: CompleteReservationInput!): Reservation
  """Confirm a PENDING online order: fires all NEW items."""
  confirmOnlineOrder(input: ConfirmOnlineOrderInput!): OnlineOrderRequest
  confirmReservation(input: ConfirmReservationInput!): Reservation
  createCategory(input: CreateCategoryInput!): Category
  createGuest(input: CreateGuestInput!): Guest
  createJobRole(input: CreateJobRoleInput!): JobRole
  createLocation(input: CreateLocationInput!): Location
  createMenu(input: CreateMenuInput!): Menu
  createMenuItem(input: CreateMenuItemInput!): MenuItem
  createMenuSection(input: CreateMenuSectionInput!): MenuSection
  createModifierGroup(input: CreateModifierGroupInput!): ModifierGroup
  createReservation(input: CreateReservationInput!): Reservation
  createSection(input: CreateSectionInput!): Section
  createShift(input: CreateShiftInput!): Shift
  createTable(input: CreateTableInput!): Table
  createTaxCategory(input: CreateTaxCategoryInput!): TaxCategory
  detachModifierGroupFromItem(input: DetachModifierGroupInput!): DetachModifierGroupResult
  duplicateWeek(input: DuplicateWeekInput!): [Shift!]
  editTimeEntry(input: EditTimeEntryInput!): TimeEntry
  endBreak(input: EndBreakInput!): Break
  endEmployment(input: EndEmploymentInput!): EmploymentProfile
  fireTicket(input: FireTicketInput!): Ticket
  fireTicketItem(input: FireTicketItemInput!): TicketItem
  inviteStaff(input: InviteStaffInput!): Invitation
  linkReservationGuest(input: LinkReservationGuestInput!): Reservation
  linkTicketGuest(input: LinkTicketGuestInput!): Ticket
  markReservationNoShow(input: MarkNoShowInput!): Reservation
  markTicketItemReady(input: MarkTicketItemReadyInput!): TicketItem
  markTicketItemServed(input: MarkTicketItemServedInput!): TicketItem
  """
  Open a new cash drawer session at the current location with the given starting cash. Fails if a session is already open.
  """
  openCashDrawer(note: String, startingCashCents: Int!): CashDrawerSession
  openTicket(input: OpenTicketInput!): Ticket
  openTicketAtTable(input: OpenTicketAtTableInput!): Ticket
  """
  Create a PENDING card tender for the ticket and dispatch it to the paired POS terminal. The terminal returns APPROVED/DECLINED via WS which captures or declines the tender (and closes the ticket on capture). Hard fails when no terminal is online.
  """
  processCardPaymentAtTerminal(input: ProcessCardPaymentAtTerminalInput!): ProcessCardPaymentAtTerminalResult
  """
  Run all tenders for a ticket through the (simulated) payment terminal. On full capture, the ticket is closed and a cash sale is recorded against the open drawer session. On any decline, nothing is persisted and the ticket stays open.
  """
  processPayment(input: ProcessPaymentInput!): Ticket
  publishShift(input: PublishShiftInput!): Shift
  publishWeek(input: PublishWeekInput!): [Shift!]
  punchIn(input: PunchInInput!): TimeEntry
  punchOut(input: PunchOutInput!): TimeEntry
  """
  Compute (or recompute) tip allocations for the given business day using the rule's current weights. Idempotent: rerunning replaces existing allocations for that (rule, day).
  """
  recomputeTipPool(businessDay: DateTime!, ruleId: UUID!): [TipAllocation!]
  """Add a manual pay-in / pay-out / deposit to the active drawer session."""
  recordCashMovement(amountCents: Int!, kind: CashMovementKind!, note: String, sessionId: UUID!): CashMovement
  """
  Record a manual stock movement (RESTOCK / WASTE / COUNT_ADJUST / TRANSFER_*). Updates the ingredient's running stock-on-hand atomically. Manager+ only.
  """
  recordStockMovement(costPerUnitCents: Int, ingredientId: UUID!, kind: StockMovementKind!, note: String, quantity: Float!, vendorId: UUID): StockMovement
  """
  Refund a previously-captured tender. Creates a sibling Tender row with negative-flow semantics and writes a REFUND_CASH movement when applicable. Manager+ only.
  """
  refundTender(amountCents: Int!, reason: String, tenderId: UUID!): Tender
  """
  Refund all or part of a CLOSED ticket. Additive — multiple partial refunds allowed up to total + tip.
  """
  refundTicket(input: RefundTicketInput!): Ticket
  """Reject a PENDING online order. Voids the linked ticket and items."""
  rejectOnlineOrder(input: RejectOnlineOrderInput!): OnlineOrderRequest
  removeItemFromMenuSection(input: RemoveItemFromMenuSectionInput!): RemoveItemFromMenuSectionResult
  reopenTicket(input: ReopenTicketInput!): Ticket
  reorderCategories(input: ReorderCategoriesInput!): ReorderCategoriesResult
  reorderMenuSectionItems(input: ReorderMenuSectionItemsInput!): ReorderMenuSectionItemsResult
  reorderMenuSections(input: ReorderMenuSectionsInput!): ReorderMenuSectionsResult
  reorderMenus(input: ReorderMenusInput!): ReorderMenusResult
  reorderModifiers(input: ReorderModifiersInput!): ReorderModifiersResult
  reorderSections(input: ReorderSectionsInput!): [Section!]
  revokeInvitation(input: RevokeInvitationInput!): RevokeInvitationResult
  revokeMembership(input: RevokeMembershipInput!): Membership
  seatReservation(input: SeatReservationInput!): SeatReservationResult
  setItem86(input: SetItem86Input!): LocationItem
  """
  Set or clear the low-stock alert threshold for an ingredient at the viewer's location. Manager+ only.
  """
  setLowStockThreshold(ingredientId: UUID!, lowStockThreshold: Float): IngredientStock
  setMyAvailability(input: SetAvailabilityInput!): [AvailabilityWindow!]
  """
  Replace the recipe for a menu item with the given list (each entry: ingredientId + quantity). Manager+ only.
  """
  setRecipe(items: JSON!, menuItemId: UUID!): [RecipeItem!]
  setTableManualState(input: SetTableManualStateInput!): Table
  setTaxRate(input: SetTaxRateInput!): TaxRate
  setTicketItemModifiers(input: SetTicketItemModifiersInput!): TicketItem
  setUserAvailability(input: SetUserAvailabilityInput!): [AvailabilityWindow!]
  """
  Anonymous public tenant signup. Creates Tenant + Location + Owner User in one transaction.
  """
  signUpTenant(input: SignUpTenantInput!): SignUpTenantResult
  startBreak(input: StartBreakInput!): Break
  """
  Anonymous public submit. Rate-limited per IP (10/min). Creates a Ticket + OnlineOrderRequest, auto-links Guest by phone.
  """
  submitOnlineOrder(input: SubmitOnlineOrderInput!): SubmitOnlineOrderResult
  """
  Anonymous public booking submit. Rate-limited per IP (5/min). Creates a PENDING reservation that staff confirm or cancel from the reservations console.
  """
  submitReservationRequest(input: SubmitReservationRequestInput!): SubmitReservationRequestResult
  unarchiveMenuItem(input: UnarchiveMenuItemInput!): MenuItem
  updateCategory(input: UpdateCategoryInput!): Category
  updateGuest(input: UpdateGuestInput!): Guest
  updateJobRole(input: UpdateJobRoleInput!): JobRole
  """
  Update the active location's phone / address / opening hours. Manager-scope; only the location in the request scope is touched.
  """
  updateLocationSettings(input: UpdateLocationSettingsInput!): Location
  updateMembershipRole(input: UpdateMembershipRoleInput!): Membership
  updateMenu(input: UpdateMenuInput!): Menu
  updateMenuItem(input: UpdateMenuItemInput!): MenuItem
  updateMenuSection(input: UpdateMenuSectionInput!): MenuSection
  updateMenuSectionItem(input: UpdateMenuSectionItemInput!): MenuSectionItem
  updateModifier(input: UpdateModifierInput!): Modifier
  updateModifierGroup(input: UpdateModifierGroupInput!): ModifierGroup
  updateReservation(input: UpdateReservationInput!): Reservation
  updateSection(input: UpdateSectionInput!): Section
  updateShift(input: UpdateShiftInput!): Shift
  updateTable(input: UpdateTableInput!): Table
  updateTicketItem(input: UpdateTicketItemInput!): TicketItem
  updateTicketLabel(input: UpdateTicketLabelInput!): Ticket
  updateTicketOrderType(input: UpdateTicketOrderTypeInput!): Ticket
  upsertEmploymentProfile(input: UpsertEmploymentProfileInput!): EmploymentProfile
  """Create / update an ingredient in the tenant catalog. Manager+ only."""
  upsertIngredient(costPerUnitCents: Int, defaultVendorId: UUID, id: UUID, name: String!, unit: String!): Ingredient
  upsertLocationItem(input: UpsertLocationItemInput!): LocationItem
  upsertLocationModifier(input: UpsertLocationModifierInput!): LocationModifier
  """
  Create a new rule or update an existing one. Manager+ only. Weights are { jobRoleId, weight: int }[] with at least one positive weight.
  """
  upsertTipPoolRule(id: UUID, isActive: Boolean, name: String!, weights: JSON!): TipPoolRule
  """Create / update a vendor for the tenant. Manager+ only."""
  upsertVendor(contactEmail: String, contactName: String, contactPhone: String, id: UUID, name: String!, notes: String): Vendor
  voidDiscount(input: VoidDiscountInput!): Discount
  voidTicket(input: VoidTicketInput!): Ticket
  voidTicketItem(input: VoidTicketItemInput!): TicketItem
}

enum OnlineOrderConfirmStatus {
  CONFIRMED
  PENDING
  REJECTED
}

input OnlineOrderFilter {
  fromDate: DateTime
  status: OnlineOrderConfirmStatus
  toDate: DateTime
}

enum OnlineOrderPaymentMode {
  PAY_AT_KIOSK
  PAY_AT_PICKUP
}

enum OnlineOrderPaymentStatus {
  CAPTURED
  DECLINED
  PENDING
}

type OnlineOrderRequest {
  confirmStatus: OnlineOrderConfirmStatus
  confirmedAt: DateTime
  confirmedBy: User
  createdAt: DateTime
  customerEmail: String
  customerName: String
  customerPhone: String
  id: ID
  notes: String
  paymentMode: OnlineOrderPaymentMode
  paymentStatus: OnlineOrderPaymentStatus
  pickupAt: DateTime
  pickupKind: OnlinePickupKind
  rejectReason: String
  rejectedAt: DateTime
  rejectedBy: User
  ticket: Ticket
}

type OnlineOrderRequestCreated {
  request: OnlineOrderRequest
}

union OnlineOrderRequestEvent = OnlineOrderRequestCreated | OnlineOrderRequestUpdated

type OnlineOrderRequestUpdated {
  request: OnlineOrderRequest
}

"""
Public, sanitized projection of an online order request used by the customer-facing tracking page.
"""
type OnlineOrderTracking {
  closedAt: DateTime
  confirmStatus: OnlineOrderConfirmStatus
  customerName: String
  estimatedReadyAt: DateTime
  isReady: Boolean
  itemSummary: String
  items: [OnlineOrderTrackingItem!]
  locationAddress: JSON
  locationName: String
  locationPhone: String
  paymentMode: OnlineOrderPaymentMode
  paymentStatus: OnlineOrderPaymentStatus
  pickupAt: DateTime
  pickupKind: OnlinePickupKind
  rejectReason: String
