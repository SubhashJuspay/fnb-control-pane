query CatalogItems($first: Int, $after: String, $filter: CatalogItemFilter) {
  catalogItems(first: $first, after: $after, filter: $filter) {
    edges {
      cursor
      node {
        id
        name
        shortDescription
        description
        basePriceCents
        imageUrl
        course
        printerStation
        archivedAt
        dietaryTags
        allergenTags
        category {
          id
          name
        }
        taxCategory {
          id
          name
          kind
        }
        modifierGroups {
          id
          name
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount
  }
}

query CatalogItem($id: UUID!) {
  catalogItem(id: $id) {
    id
    name
    shortDescription
    description
    basePriceCents
    imageUrl
    course
    printerStation
    archivedAt
    dietaryTags
    allergenTags
    category {
      id
      name
    }
    taxCategory {
      id
      name
      kind
    }
    modifierGroups {
      id
      name
      minSelections
      maxSelections
    }
  }
}

query CatalogCategories {
  catalogCategories {
    id
    name
    slug
    sortOrder
    archivedAt
  }
}

query CatalogTaxCategories {
  catalogTaxCategories {
    id
    name
    kind
    archivedAt
  }
}

query CatalogTaxCategoryRates($id: UUID!, $locationId: UUID!) {
  catalogTaxCategories {
    id
    name
    kind
    ratesAtLocation(locationId: $locationId) {
      id
      ratePermille
      effectiveFrom
      effectiveUntil
    }
  }
}

query CatalogModifierGroups($first: Int, $after: String) {
  catalogModifierGroups(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        minSelections
        maxSelections
        archivedAt
        modifiers {
          id
        }
        attachedItems {
          id
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount
  }
}

query CatalogModifierGroup($id: UUID!) {
  catalogModifierGroup(id: $id) {
    id
    name
    minSelections
    maxSelections
    archivedAt
    modifiers {
      id
      name
      priceDeltaCents
      isDefault
      sortOrder
      archivedAt
    }
    attachedItems {
      id
      name
    }
  }
}

