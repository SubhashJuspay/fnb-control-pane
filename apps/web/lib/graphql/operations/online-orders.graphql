query PublicLocationBySlug($tenantSlug: String!, $locationSlug: String!, $at: DateTime) {
  publicLocationBySlug(tenantSlug: $tenantSlug, locationSlug: $locationSlug) {
    id
    name
    slug
    tenantName
    timezone
    currency
    phone
    address
    openingHours
    activeMenus(at: $at) {
      id
      name
      description
      sections {
        id
        name
        items {
          id
          name
          description
          shortDescription
          imageUrl
          effectivePriceCents
          available
          dietaryTags
          allergenTags
          modifierGroups {
            id
            name
            minSelections
            maxSelections
            modifiers {
              id
              name
              priceDeltaCents
              available
            }
          }
        }
      }
    }
  }
}

query TrackOnlineOrder($token: String!) {
  trackOnlineOrder(token: $token) {
    confirmStatus
    paymentMode
    paymentStatus
    customerName
    estimatedReadyAt
    isReady
    itemSummary
    pickupAt
    pickupKind
    rejectReason
    shortNumber
    subtotalCents
    taxCents
    totalCents
    ticketStatus
  }
}

query ReceiptOnlineOrder($token: String!) {
  trackOnlineOrder(token: $token) {
    shortNumber
    customerName
    confirmStatus
    ticketStatus
    pickupAt
    pickupKind
    subtotalCents
    taxCents
    totalCents
    tipCents
    closedAt
    tenantName
    locationName
    locationPhone
    locationAddress
    items {
      nameSnapshot
      quantity
      unitPriceCents
      modifiersTotalCents
      lineSubtotalCents
      status
      modifiers {
        nameSnapshot
        priceDeltaCents
      }
    }
  }
}

mutation SubmitOnlineOrder($input: SubmitOnlineOrderInput!) {
  submitOnlineOrder(input: $input) {
    trackingToken
    trackingUrl
    shortNumber
    estimatedReadyAt
  }
}

query OnlineOrderRequests($filter: OnlineOrderFilter) {
  onlineOrderRequests(filter: $filter) {
    id
    confirmStatus
    customerName
    customerPhone
    customerEmail
    notes
    pickupKind
    pickupAt
    createdAt
    confirmedAt
    rejectedAt
    rejectReason
    ticket {
      id
      shortNumber
      subtotalCents
      totalCents
      items {
        id
        nameSnapshot
        quantity
        modifiers {
          id
          nameSnapshot
        }
      }
    }
  }
}

mutation ConfirmOnlineOrder($input: ConfirmOnlineOrderInput!) {
  confirmOnlineOrder(input: $input) {
    id
    confirmStatus
    confirmedAt
  }
}

mutation RejectOnlineOrder($input: RejectOnlineOrderInput!) {
  rejectOnlineOrder(input: $input) {
    id
    confirmStatus
    rejectedAt
    rejectReason
  }
}

subscription OnlineOrderRequestsStream {
  onlineOrderRequests {
    __typename
    ... on OnlineOrderRequestCreated {
      request {
        id
        confirmStatus
        customerName
        customerPhone
        customerEmail
        notes
        pickupKind
        pickupAt
        createdAt
        ticket {
          id
          shortNumber
          totalCents
          items {
            id
            nameSnapshot
            quantity
          }
        }
      }
    }
    ... on OnlineOrderRequestUpdated {
      request {
        id
        confirmStatus
        confirmedAt
        rejectedAt
        rejectReason
      }
    }
  }
}
