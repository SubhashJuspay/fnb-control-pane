mutation ProcessPayment($input: ProcessPaymentInput!) {
  processPayment(input: $input) {
    id
    status
    closedAt
    tipCents
    totalCents
  }
}

mutation ProcessCardPaymentAtTerminal($input: ProcessCardPaymentAtTerminalInput!) {
  processCardPaymentAtTerminal(input: $input) {
    tenderId
    amountCents
    tipCents
    currency
  }
}

query Tender($id: UUID!) {
  tender(id: $id) {
    id
    method
    status
    amountCents
    tipCents
    declineReason
    authCode
  }
}

query TicketTenders($ticketId: UUID!) {
  ticketTenders(ticketId: $ticketId) {
    id
    method
    status
    amountCents
    tipCents
    tenderedCents
    changeCents
    cardBrand
    cardLast4
    authCode
    processedAt
  }
}
