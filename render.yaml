# Render Blueprint — deploys the GraphQL API.
# Web stays on Vercel; this file only covers the api service.
#
# Setup:
#   1. Push this file to main.
#   2. In Render, click "New" → "Blueprint" → connect this repo → apply.
#   3. Fill the sync:false env vars (DATABASE_URL, AUTH_URL, etc.) when prompted.
#
# The build runs from the repo root because this is a pnpm workspace; setting
# rootDir: apps/api would hide @repo/db, @repo/types, @repo/validation.
#
# postinstall in @repo/db runs `prisma generate`, so the Pothos types are ready
# by the time we tsup the api.

services:
  - type: web
    name: fnb-api
    runtime: node
    # Free tier — no card required, but the instance sleeps after 15 min idle
    # (~30s cold start on next request) and `preDeployCommand` is unsupported.
    # When the prototype graduates, flip to `plan: starter` and uncomment the
    # `preDeployCommand` below to get always-on + auto-migrations.
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /health
    # Scope the install to @app/api + its workspace deps (@repo/db,
    # @repo/types, @repo/validation). Without `--filter` pnpm pulls every
    # workspace — including Next.js, Sharp's native binaries, Recharts, etc.
    # — and the build agent OOMs (>8GB heap on the free runner).
    #
    # `--prod=false` keeps devDeps so tsup is available at build time. Render
    # caches node_modules between deploys so this doesn't reinstall every push.
    buildCommand: |
      corepack enable && \
      corepack prepare pnpm@9.15.0 --activate && \
      pnpm install --frozen-lockfile --filter '@app/api...' --prod=false && \
      pnpm --filter @app/api build
    # Skip pnpm/corepack at boot — that downloads pnpm on every cold start
    # which adds ~10s before the health check can pass. The tsup build already
    # produced apps/api/dist/server.js; run it directly with node.
    startCommand: node apps/api/dist/server.js
    # preDeployCommand: pnpm --filter @repo/db migrate:deploy  # requires Starter+
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render injects PORT; api/src/server.ts reads process.env.PORT.
      # Paste the Neon connection string (or attach a Render Postgres) at deploy.
      - key: DATABASE_URL
        sync: false
      # Generate with: openssl rand -base64 32 — must match AUTH_SECRET on Vercel
      # so signed cookies cross-validate between web and api.
      - key: AUTH_SECRET
        sync: false
      # Public URL of the Vercel-hosted web app, e.g. https://fnb.vercel.app
      - key: AUTH_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional observability — leave blank if unused.
      - key: SENTRY_DSN
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: fnb-api
      # Optional Twilio SMS — all three required together or dispatch is a no-op.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
